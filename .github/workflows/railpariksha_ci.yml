name: RailPariksha CI
on:
  push:
    branches: [main]
    paths: ["railpariksha/**"]
  pull_request:
    paths: ["railpariksha/**"]

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python railpariksha/pipeline/validate.py

  app:
    runs-on: ubuntu-latest
    needs: content
    defaults: { run: { working-directory: railpariksha/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: python ../pipeline/build_bundle.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: railpariksha-apk
          path: railpariksha/app/build/app/outputs/flutter-apk/*.apk
