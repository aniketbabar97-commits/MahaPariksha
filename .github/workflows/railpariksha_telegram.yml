# Posts the RailPariksha Telegram channel's daily schedule (quiz polls, flashcards and cheat sheets, a study
# tip, the Sunday recap). The morning current-affairs card is posted by the daily current-affairs workflow, right
# after the day's feed is built. Everything comes from content already in the repo; see pipeline/telegram_bot.py.
# The owner's only work: create the channel, add the bot as an admin (post, pin, change channel info), and set the
# secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. Without them every run ends quietly.
name: RailPariksha Telegram
on:
  # Started by the Cloudflare Worker `railpariksha-scheduler` (railpariksha/ops/scheduler_worker.js, set up as in
  # railpariksha/docs/SCHEDULER.md): every hour 06:00 to 23:00 IST it dispatches `quiz`, except 11:00 `fact`,
  # 17:00 `tip` and Sunday 19:00 `weekly`. GitHub's own `schedule:` is not used: it ran hours late or not at all.
  workflow_dispatch:
    inputs:
      slot:
        description: Which post to send now
        type: choice
        default: announce
        options: [announce, setup, refresh, ca, quiz, poll_morning, fact, poll_noon, tip, poll_evening, weekly]
      text:
        description: Text for "announce" (plain text, sent as written)
        required: false

permissions:
  contents: read

# Posts must not overlap or be cancelled halfway.
concurrency:
  group: railpariksha-telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - id: slot
        run: |
          s="${{ github.event.inputs.slot }}"
          echo "slot=$s" >> "$GITHUB_OUTPUT"
          if [ "$s" = none ]; then echo "::notice::nothing to post at this hour"
          elif [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set; nothing to post."; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: steps.slot.outputs.have == 'true'
        uses: actions/checkout@v4
      - if: steps.slot.outputs.have == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.slot.outputs.have == 'true'
        run: python railpariksha/pipeline/telegram_bot.py --slot "${{ steps.slot.outputs.slot }}" ${ANNOUNCE:+--text "$ANNOUNCE"}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANNOUNCE: ${{ github.event.inputs.text }}
