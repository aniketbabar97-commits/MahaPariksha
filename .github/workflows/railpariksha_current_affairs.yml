# Drafts verified railway/national current-affairs MCQs every morning (06:45 IST), opens a PR and merges it
# itself (last step). Gemini and/or Grok do the drafting, an exam-relevance check and the cross-check; if
# ANTHROPIC_API_KEY is also set, Claude runs one more blind-solve gate before an item is kept. Merging the
# PR publishes the day's digest to phones through content/ca_feed.json.
# Needs at least one of: GEMINI_API_KEY, GROK_API_KEY (ANTHROPIC_API_KEY optional but recommended).
name: RailPariksha daily current affairs
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: railpariksha } }
    steps:
      # Without a drafting key there is nothing to run; say so instead of failing every morning.
      - id: keys
        working-directory: .
        run: |
          if [ -n "$GEMINI_API_KEY$GROK_API_KEY" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No GEMINI_API_KEY/GROK_API_KEY secret set; skipping daily current affairs."; fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      - if: steps.keys.outputs.have == 'true'
        uses: actions/checkout@v4
      - if: steps.keys.outputs.have == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.keys.outputs.have == 'true'
        run: pip install -r pipeline/requirements.txt
      - if: steps.keys.outputs.have == 'true'
        run: python pipeline/ca_daily.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: steps.keys.outputs.have == 'true'
        run: python pipeline/validate.py
      # The app downloads this small feed on launch, so merging this PR is what publishes the day's digest.
      - if: steps.keys.outputs.have == 'true'
        run: python pipeline/build_ca_feed.py
      - if: steps.keys.outputs.have == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content/railpariksha-current-affairs-daily
          title: "RailPariksha current affairs: ${{ github.run_id }}"
          commit-message: "Add verified daily current-affairs questions"
          body: |
            Automatically drafted from news feeds, then cross-checked by an independent model
            (and gated by Claude when ANTHROPIC_API_KEY is set) via a blind re-solve against the
            source text. Review the questions (source links are in `src`) and merge to publish.
          add-paths: |
            railpariksha/content/bank/current_affairs_auto.json
            railpariksha/content/ca_feed.json
      # Merges automatically, as the repo owner asked. Every item has already passed the exam-relevance gate,
      # the cross-model blind solve (plus the Claude gate when its key is set) and validate.py above; the job
      # stops before this step if any of them fails. To go back to merging by hand, delete this step.
      - if: steps.keys.outputs.have == 'true' && steps.cpr.outputs.pull-request-number != ''
        working-directory: .
        continue-on-error: true
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
