# Makes one YouTube Short from a previous-year question, six times a day (Hindi and English alternating), and uploads it when the YouTube secrets
# exist (YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN; see railpariksha/docs/YOUTUBE.md). Without them the
# video is still built and kept as a workflow file, so it can be uploaded by hand. See pipeline/shorts.py.
name: RailPariksha Shorts
on:
  # Started by the Cloudflare Worker `railpariksha-scheduler` (railpariksha/ops/scheduler_worker.js, set up as in
  # railpariksha/docs/SCHEDULER.md) at 07:00, 10:00, 13:00, 16:00, 19:00 and 22:00 IST with slots 1 to 6. YouTube's
  # default API quota (10,000 units, 1,600 per upload) allows six uploads a day at most. GitHub's own `schedule:` is not
  # used: it ran hours late or not at all.
  workflow_dispatch:
    inputs:
      slot:
        description: Which slot of the day (1 = 07:00 ... 6 = 22:00 IST)
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]
        default: "1"
      lang:
        description: Language (auto alternates, and flips every day)
        type: choice
        options: [auto, hi, en]
        default: auto
permissions:
  contents: read
concurrency:
  group: railpariksha-shorts
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
      SLOT: ${{ github.event.inputs.slot }}
      SHORTS_VOICE_HI: ${{ vars.SHORTS_VOICE_HI }}
      SHORTS_VOICE_EN: ${{ vars.SHORTS_VOICE_EN }}
      LANG_CHOICE: ${{ github.event.inputs.lang || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
      - run: pip install -q pillow requests gtts edge-tts
      - run: python railpariksha/pipeline/shorts.py --slot "$SLOT" --lang "$LANG_CHOICE" --out short_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-${{ env.SLOT }}
          path: short_out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
