<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071F45"/>
      <stop offset="0.5" stop-color="#0B2E63"/>
      <stop offset="1" stop-color="#1E4C8F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F701A"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E4C766"/>
    </linearGradient>
  </defs>

  <!-- background field -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- road -->
  <polygon points="176,392 336,392 282,254 230,254" fill="#ffffff" opacity="0.14"/>
  <line x1="256" y1="272" x2="256" y2="292" stroke="#E4C766" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="256" y1="312" x2="256" y2="332" stroke="#E4C766" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="256" y1="352" x2="256" y2="372" stroke="#E4C766" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- steering wheel ring -->
  <circle cx="256" cy="205" r="128" fill="none" stroke="url(#gold)" stroke-width="23"/>

  <!-- spokes -->
  <g stroke="#C9A227" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="112" x2="256" y2="169"/>
    <line x1="256" y1="112" x2="256" y2="169" transform="rotate(120 256 205)"/>
    <line x1="256" y1="112" x2="256" y2="169" transform="rotate(240 256 205)"/>
  </g>

  <!-- hub -->
  <circle cx="256" cy="205" r="37" fill="#071F45" stroke="#E4C766" stroke-width="5"/>

  <!-- car glyph on hub -->
  <rect x="227" y="200" width="58" height="22" rx="7" fill="#E4C766"/>
  <rect x="241" y="188" width="30" height="15" rx="5" fill="#E4C766"/>

  <!-- wordmark -->
  <text x="256" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900"
        font-size="44" letter-spacing="6" fill="#ffffff">RUKHSA</text>
  <text x="256" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700"
        font-size="15" letter-spacing="3" fill="#c9d3e6">UAE DRIVING TEST</text>
</svg>
